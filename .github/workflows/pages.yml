name: Deploy Relay Board frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Configure backend origin
        env:
          RELAY_API_BASE: ${{ vars.RELAY_API_BASE }}
        run: |
          if [ -n "$RELAY_API_BASE" ]; then
            sed -i "s#<meta name=\"relay-api-base\" content=\"\">#<meta name=\"relay-api-base\" content=\"$RELAY_API_BASE\">#g" index.html analysis.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
